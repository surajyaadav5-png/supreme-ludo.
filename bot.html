
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#091329">
<title>Supreme Ludo - Bot</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#091329;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
 background:#111f3b;
 border-bottom:2px solid #c49a43;
}
button{cursor:pointer}
.topbtn{
 background:#172d51;
 color:#ffe3a0;
 border:1px solid #c49a43;
 border-radius:12px;
 padding:10px 13px;
 font-weight:bold;
}
.brand{color:#f5d58c;font-weight:bold;font-size:17px}
.info{
 display:flex;
 justify-content:space-between;
 padding:16px 12px;
 color:#f5d58c;
 font-size:12px;
}
.wrap{width:100%;max-width:650px;margin:auto;padding:8px}
.board{
 width:100%;
 aspect-ratio:1;
 display:grid;
 grid-template-columns:repeat(15,1fr);
 grid-template-rows:repeat(15,1fr);
 background:white;
 border:4px solid #c49a43;
 border-radius:5px;
 overflow:hidden;
 position:relative;
}
.cell{
 border:1px solid #aaa;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 min-width:0;
 min-height:0;
}
.red-home{background:#ed171d}
.blue-home{background:#22a5e5}
.yellow-home{background:#ffdf00}
.green-home{background:#009c4c}
.track{background:#fff}
.red-lane{background:#ed171d}
.blue-lane{background:#22a5e5}
.yellow-lane{background:#ffdf00}
.green-lane{background:#009c4c}
.arrow{font-size:clamp(9px,2.5vw,18px);color:#999}
.star{font-size:clamp(10px,3vw,20px);color:#888}
.home-inner{
 position:absolute;
 background:#fff;
 border:2px solid #777;
 display:grid;
 grid-template-columns:1fr 1fr;
 grid-template-rows:1fr 1fr;
 gap:12%;
 padding:10%;
}
.home-dot{
 border-radius:50%;
 border:2px solid #aaa;
 position:relative;
}
.home-dot.red{background:#e51d25}
.home-dot.blue{background:#20a5e5}
.home-dot.yellow{background:#ffdf00}
.home-dot.green{background:#009c4c}
.center{
 grid-area:7/7/10/10;
 z-index:4;
 position:relative;
 overflow:hidden;
 background:conic-gradient(
 #ed171d 0deg 90deg,
 #009c4c 90deg 180deg,
 #22a5e5 180deg 270deg,
 #ffdf00 270deg 360deg
 );
 border:1px solid #777;
}
.center:after{
 content:"SL";
 position:absolute;
 width:30%;
 height:30%;
 left:35%;
 top:35%;
 border-radius:50%;
 background:#101a32;
 border:2px solid #f5d58c;
 color:#ffe6a2;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:clamp(8px,2vw,15px);
}
.token{
 width:75%;
 height:75%;
 position:absolute;
 border-radius:50%;
 border:2px solid white;
 box-shadow:0 3px 4px #0008,inset 0 -4px 4px #0005;
 z-index:8;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 font-size:clamp(8px,2vw,13px);
 font-weight:bold;
 cursor:pointer;
}
.token.red{
 background:radial-gradient(circle at 35% 25%,#fff,#ff7474 25%,#bd0000 75%);
}
.token.blue{
 background:radial-gradient(circle at 35% 25%,#fff,#85d8ff 25%,#0064c5 75%);
}
.token.selected{
 outline:3px solid #ffe54a;
 transform:scale(1.12);
}
.player-area{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:14px;
}
.player{
 border:3px solid #e9c54c;
 border-radius:13px;
 text-align:center;
 padding:12px 5px;
 background:#153c7b;
}
.player.bot{background:#691c28}
.player h3{font-size:17px;margin-bottom:8px}
.lives{display:flex;justify-content:center;gap:7px;margin:10px 0}
.life{
 width:12px;height:12px;
 border-radius:50%;
 background:#00df51;
 border:1px solid white;
}
.life.off{background:#e32b36}
.coins{font-size:14px;color:#ffe4a0;font-weight:bold}
.dice-area{
 display:flex;
 align-items:center;
 flex-direction:column;
 gap:14px;
 margin:25px 0;
}
.dice{
 width:105px;height:105px;
 background:linear-gradient(145deg,#fff,#dedede);
 color:#14223c;
 border:6px solid #d3a53c;
 border-radius:27px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:58px;
 font-weight:bold;
 box-shadow:0 5px 15px #0008;
}
.roll{
 padding:14px 45px;
 background:linear-gradient(120deg,#ffe6a2,#bd8730);
 color:#17213b;
 border:0;
 border-radius:12px;
 font-size:16px;
 font-weight:900;
}
.roll:disabled{opacity:.5}
.status{
 background:#172947;
 border:1px solid #bd913e;
 border-radius:10px;
 text-align:center;
 padding:13px;
 color:#ffe6a2;
 font-size:13px;
 min-height:43px;
}
.rules{
 margin:15px 0;
 padding:13px;
 border:1px solid #665536;
 border-radius:10px;
 color:#c3cde0;
 font-size:12px;
 line-height:1.8;
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:30;
 background:#000c;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.modal-box{
 width:100%;
 max-width:340px;
 padding:25px;
 background:#102c64;
 border:3px solid #f5cf4c;
 border-radius:18px;
 text-align:center;
}
.modal-box h2{color:#ffe04b;margin-bottom:15px}
.modal-box button{
 margin:12px 5px 0;
 padding:12px 18px;
 border:0;
 border-radius:9px;
 background:#ffe4a0;
 color:#17213b;
 font-weight:bold;
}
@media(max-width:380px){
 .brand{font-size:14px}
 .info{font-size:10px}
 .player h3{font-size:14px}
}
</style>
</head>

<body>

<header>
 <button class="topbtn" onclick="location.href='index.html'">← BACK</button>
 <div class="brand">👑 SUPREME LUDO</div>
 <button class="topbtn" onclick="location.reload()">↻</button>
</header>

<div class="info">
 <span>🤖 BOT MODE</span>
 <span>CLASSIC 1 VS 1</span>
 <span>V1.0</span>
</div>

<main class="wrap">

 <div class="board" id="board"></div>

 <div class="player-area">
  <div class="player">
   <h3>🔵 YOU</h3>
   <div class="lives" id="blueLives"></div>
   <div class="coins">🪙 <span id="coinBalance">0</span></div>
  </div>

  <div class="player bot">
   <h3>🔴 BOT</h3>
   <div class="lives" id="redLives"></div>
   <div class="coins">🤖 AI PLAYER</div>
  </div>
 </div>

 <div class="dice-area">
  <div class="dice" id="dice">🎲</div>
  <button class="roll" id="roll" onclick="rollDice()">ROLL DICE</button>
 </div>

 <div class="status" id="status">
  Your Turn! Roll the Dice 🎲
 </div>

 <div class="rules">
  <b>👑 SUPREME LUDO RULES</b><br>
  🔵 You vs 🔴 Bot<br>
  🎲 Roll 6 to open a token<br>
  👆 Tap your token to select it<br>
  ❤️ Both players have 5 Lives<br>
  🪙 Winning reward: 10 Coins<br>
  🆓 No entry fee
 </div>
</main>

<div class="modal" id="result">
 <div class="modal-box">
  <h2 id="resultTitle">🏆 YOU WON!</h2>
  <p id="resultText"></p>
  <button onclick="location.reload()">PLAY AGAIN</button>
  <button onclick="location.href='index.html'">HOME</button>
 </div>
</div>

<script>
const board=document.getElementById("board");

const colors={
 red:"#ed171d",
 blue:"#22a5e5",
 yellow:"#ffdf00",
 green:"#009c4c"
};

function addCell(r,c,cls){
 const el=document.createElement("div");
 el.className="cell "+cls;
 el.style.gridRow=r+"/"+(r+1);
 el.style.gridColumn=c+"/"+(c+1);
 board.appendChild(el);
 return el;
}

// Four colored home areas
const homes=[
 {name:"yellow",r:1,c:1},
 {name:"red",r:1,c:10},
 {name:"blue",r:10,c:1},
 {name:"green",r:10,c:10}
];

homes.forEach(home=>{
 const el=document.createElement("div");
 el.className="cell "+home.name+"-home";
 el.style.gridRow=home.r+"/"+(home.r+6);
 el.style.gridColumn=home.c+"/"+(home.c+6);
 board.appendChild(el);

 const inner=document.createElement("div");
 inner.className="home-inner";
 inner.style.width="68%";
 inner.style.height="68%";
 inner.style.left="16%";
 inner.style.top="16%";
 el.appendChild(inner);

 for(let i=0;i<4;i++){
  const dot=document.createElement("div");
  dot.className="home-dot "+home.name;
  inner.appendChild(dot);
 }
});

// Track: three-wide cross
for(let r=0;r<15;r++){
 for(let c=0;c<15;c++){
  const inCross=(r>=6&&r<=8)||(c>=6&&c<=8);
  const inCenter=r>=6&&r<=8&&c>=6&&c<=8;
  const inHome=homes.some(h=>
   r>=h.r&&r<h.r+6&&c>=h.c&&c<h.c+6
  );

  if(!inCross||inCenter||inHome)continue;

  let cls="track";

  if(c===7&&r>=1&&r<=5)cls="red-lane";
  if(c===7&&r>=9&&r<=13)cls="blue-lane";
  if(r===7&&c>=1&&c<=5)cls="yellow-lane";
  if(r===7&&c>=9&&c<=13)cls="green-lane";

  const el=addCell(r+1,c+1,cls);

  // Safe stars
  if((r===6&&c===2)||(r===2&&c===8)||
     (r===8&&c===12)||(r===12&&c===6)){
   el.innerHTML="☆";
   el.classList.add("star");
  }

  // Direction arrows
  if((r===7&&c===0)||(r===0&&c===7)||
     (r===7&&c===14)||(r===14&&c===7)){
   el.innerHTML=(r===7&&c===0)?"➜":
   (r===0&&c===7)?"↓":
   (r===7&&c===14)?"←":"↑";
   el.classList.add("arrow");
  }
 }
}

// Center four triangles
const center=document.createElement("div");
center.className="center";
board.appendChild(center);

// Game state
let positions={
 blue:[-1,-1,-1,-1],
 red:[-1,-1,-1,-1]
};

let turn="blue";
let diceValue=0;
let canChoose=false;
let selected=null;
let gameOver=false;

let blueLives=5;
let redLives=5;

let blueCoins=Number(localStorage.getItem("supremeBotCoins")||0);

const homePositions={
 blue:[[11,2],[11,4],[13,2],[13,4]],
 red:[[2,11],[2,13],[4,11],[4,13]]
};

// Visual token homes and selection
function drawTokens(){
 document.querySelectorAll(".token").forEach(t=>t.remove());

 ["blue","red"].forEach(color=>{
  positions[color].forEach((pos,index)=>{
   let token=document.createElement("div");
   token.className="token "+color;
   token.textContent="●";

   const [r,c]=homePositions[color][index];

   // Initial token positions inside the matching home
   const target=document.createElement("div");
   target.style.position="absolute";
   target.style.inset="0";
   target.style.pointerEvents="none";

   const cell=document.createElement("div");
   cell.className="token "+color;
   cell.textContent="●";
   cell.style.left=(c/15*100+3)+"%";
   cell.style.top=(r/15*100+3)+"%";

   if(pos===-1){
    board.appendChild(cell);
   }else{
    // Tokens remain represented on the board until movement logic is added.
    board.appendChild(cell);
   }

   cell.style.pointerEvents="auto";
   cell.onclick=()=>{
    if(color==="blue"&&canChoose&&!gameOver){
     document.getElementById("status").textContent=
      "Token "+(index+1)+" selected. Movement is the next gameplay stage.";
    }
   };
  });
 });
}

function showLives(){
 document.getElementById("blueLives").innerHTML=
 Array.from({length:5},(_,i)=>
 `<span class="life ${i>=blueLives?"off":""}"></span>`
 ).join("");

 document.getElementById("redLives").innerHTML=
 Array.from({length:5},(_,i)=>
 `<span class="life ${i>=redLives?"off":""}"></span>`
 ).join("");

 document.getElementById("coinBalance").textContent=blueCoins;
}

function rollDice(){
 if(turn!=="blue"||gameOver||canChoose)return;

 diceValue=Math.floor(Math.random()*6)+1;
 document.getElementById("dice").textContent=diceValue;

 canChoose=true;
 document.getElementById("roll").disabled=true;

 document.getElementById("status").textContent=
 "You rolled "+diceValue+". Select a Blue token.";

}

showLives();
drawTokens();
</script>

</body>
</html>

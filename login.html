
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#091329">
<title>Login | Supreme Ludo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#091329;color:white;font-family:Arial,sans-serif;
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
}
.card{
 width:100%;max-width:380px;
 background:linear-gradient(145deg,#1d3155,#101a31);
 border:1px solid #b58c43;border-radius:18px;
 padding:28px 22px;text-align:center;
 box-shadow:0 10px 35px #0009;
}
.logo{width:85px;height:85px;object-fit:contain}
h1{color:#f5d58c;font-size:25px;margin:12px 0 8px}
p{color:#9baac5;font-size:13px;margin-bottom:22px}
input{
 width:100%;padding:14px;margin-bottom:14px;
 border:1px solid #695a40;border-radius:8px;
 background:#091329;color:white;outline:none;font-size:14px;
}
input:focus{border-color:#f5d58c}
button{
 width:100%;padding:14px;border:0;border-radius:8px;
 font-weight:900;font-size:14px;cursor:pointer;
}
.email-btn{
 background:linear-gradient(120deg,#ffe6a2,#bd8730);
 color:#17213b;
}
.google-btn{
 background:white;color:#333;
 display:flex;align-items:center;justify-content:center;
 gap:10px;margin-bottom:18px;
}
.google-btn img{width:19px;height:19px}
button:disabled{opacity:.6}
#message{margin-top:15px;font-size:13px;color:#f5d58c}
a{color:#f5d58c;text-decoration:none}
.bottom{margin-top:22px;font-size:13px}
.divider{color:#8290a9;font-size:12px;margin:17px 0}
</style>
</head>

<body>
<div class="card">

<img src="logo.jpg" class="logo" alt="Supreme Ludo">

<h1>SUPREME LUDO</h1>
<p>👑 Welcome Back, Player! 👑</p>

<button class="google-btn" id="googleBtn">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
Continue with Google
</button>

<div class="divider">— OR LOGIN WITH EMAIL —</div>

<form id="loginForm">
<input type="email" id="email"
 placeholder="Enter Email Address" required>

<input type="password" id="password"
 placeholder="Enter Password" required>

<button type="submit" class="email-btn" id="loginBtn">
LOGIN NOW
</button>
</form>

<div id="message"></div>

<div class="bottom">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

<div class="bottom">
<a href="index.html">← Back to Home</a>
</div>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
 signInWithEmailAndPassword,
 GoogleAuthProvider,
 signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const message = document.getElementById("message");
const googleBtn = document.getElementById("googleBtn");
const loginBtn = document.getElementById("loginBtn");

function goToDashboard(){
 window.location.href = "dashboard.html";
}

// Google Login
googleBtn.addEventListener("click", async()=>{

 googleBtn.disabled = true;
 message.textContent = "Connecting to Google...";

 try{
   const provider = new GoogleAuthProvider();
   provider.setCustomParameters({prompt:"select_account"});

   await signInWithPopup(auth,provider);

   message.textContent = "Google Login Successful!";
   goToDashboard();

 }catch(error){
   console.error(error);
   message.textContent =
     error.code === "auth/popup-closed-by-user"
     ? "Login cancelled."
     : "Google Login Failed: " + error.message;

   googleBtn.disabled = false;
 }
});

// Email Login
document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

 e.preventDefault();

 loginBtn.disabled = true;
 message.textContent = "Please wait...";

 try{

   await signInWithEmailAndPassword(
     auth,
     document.getElementById("email").value.trim(),
     document.getElementById("password").value
   );

   message.textContent = "Login Successful!";
   goToDashboard();

 }catch(error){

   console.error(error);

   message.textContent =
     error.code === "auth/invalid-credential"
     ? "Incorrect Email or Password!"
     : "Login Failed: " + error.message;

   loginBtn.disabled = false;
 }
});

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#091329">
<title>Signup | Supreme Ludo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#091329;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.card{
 width:100%;
 max-width:380px;
 background:linear-gradient(145deg,#1d3155,#101a31);
 border:1px solid #b58c43;
 border-radius:18px;
 padding:28px 22px;
 box-shadow:0 10px 35px #0009;
 text-align:center;
}

.logo{
 width:85px;
 height:85px;
 object-fit:contain;
}

h1{
 color:#f5d58c;
 font-size:25px;
 margin:12px 0 8px;
}

p{
 color:#9baac5;
 font-size:13px;
 margin-bottom:22px;
}

input{
 width:100%;
 padding:14px;
 margin-bottom:14px;
 border:1px solid #695a40;
 border-radius:8px;
 background:#091329;
 color:white;
 outline:none;
 font-size:14px;
}

input:focus{border-color:#f5d58c}

button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:8px;
 background:linear-gradient(120deg,#ffe6a2,#bd8730);
 color:#17213b;
 font-weight:900;
 font-size:15px;
 cursor:pointer;
}

button:disabled{opacity:.6}

#message{
 margin-top:15px;
 font-size:13px;
 color:#f5d58c;
}

a{
 color:#f5d58c;
 text-decoration:none;
}

.bottom{
 margin-top:22px;
 font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.jpg" class="logo" alt="Logo">

<h1>SUPREME LUDO</h1>
<p>👑 Create Your Player Account 👑</p>

<form id="signupForm">

<input
 type="text"
 id="username"
 placeholder="Enter Player Name"
 minlength="3"
 maxlength="20"
 required
>

<input
 type="email"
 id="email"
 placeholder="Enter Email Address"
 autocomplete="email"
 required
>

<input
 type="password"
 id="password"
 placeholder="Create Password (Minimum 8 Characters)"
 minlength="8"
 autocomplete="new-password"
 required
>

<button type="submit" id="signupBtn">
CREATE ACCOUNT
</button>

</form>

<div id="message"></div>

<div class="bottom">
Already have an account?
<a href="login.html">Login Here</a>
</div>

<div class="bottom">
<a href="index.html">← Back to Home</a>
</div>

</div>

<script type="module">

import { auth, database } from "./firebase.js";

import {
 createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 ref,
 set
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const button = document.getElementById("signupBtn");

form.addEventListener("submit", async (e)=>{

 e.preventDefault();

 const username = document.getElementById("username").value.trim();
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 if(username.length < 3){
   message.textContent = "Player name must be at least 3 characters.";
   return;
 }

 if(password.length < 8){
   message.textContent = "Password must be at least 8 characters.";
   return;
 }

 button.disabled = true;
 message.textContent = "Creating your account...";

 try{

   const credential = await createUserWithEmailAndPassword(
     auth,
     email,
     password
   );

   const user = credential.user;

   await set(ref(database, "players/" + user.uid), {
     username: username,
     email: user.email,
     coins: 0,
     wins: 0,
     losses: 0,
     createdAt: Date.now()
   });

   message.textContent = "Account Created Successfully!";

   window.location.href = "dashboard.html";

 }catch(error){

   console.error(error);

   if(error.code === "auth/email-already-in-use"){
     message.textContent = "This Email Is Already Registered!";
   }
   else if(error.code === "auth/weak-password"){
     message.textContent = "Please Choose A Strong Password!";
   }
   else if(error.code === "auth/invalid-email"){
     message.textContent = "Invalid Email Address!";
   }
   else if(error.code === "auth/operation-not-allowed"){
     message.textContent = "Enable Email/Password Authentication!";
   }
   else{
     message.textContent = "Signup Failed: " + error.message;
   }

   button.disabled = false;

 }

});

</script>

</body>
  </html>
